
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link2QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f5f0e6] flex items-center justify-center p-4">
    <div class="bg-[#fffdf7] p-8 rounded-2xl shadow-lg w-full max-w-md text-center border border-[#e8dcc5]">
        <h1 class="text-3xl font-bold text-[#6b4f2a] mb-3">
            Link2QR
        </h1>
        <p class="text-[#82745e] mb-6">
            Turn any link into a QR code
        </p>
        <form id="qrForm">
            <input type="url"id="link"  placeholder="https://example.com"    required class="w-full border border-[#d8c8a8] bg-white rounded-xl p-3 mb-4  text-[#4b3621] placeholder-[#a99a80]  focus:outline-none focus:ring-2 focus:ring-[#e5bd62]"   >
            <button    type="submit" id="generateBtn" class="w-full bg-[#c49a45] text-white font-semibold p-3   rounded-xl hover:bg-[#a98132] transition disabled:opacity-50"  >
                Generate QR Code
            </button>
        </form>
        <p id="message" class="mt-4 text-sm text-[#82745e]"></p>
        <div id="result" class="hidden mt-6">
            <div class="bg-[#faf3df] border border-[#e8d6a8] rounded-xl p-5">
                <h2 class="font-semibold text-[#6b4f2a] mb-4">
                    Your QR Code
                </h2>
                <img id="qrImage"  class="w-48 h-48 mx-auto bg-white p-2 rounded-lg shadow-sm"alt="Generated QR Code" >
                <a id="download" download="myqr.png" class="flex items-center justify-center gap-2    mt-5 w-full bg-[#647653] text-white font-semibold   p-3 rounded-xl hover:bg-[#506342] transition   cursor-pointer"> <span>↓</span>
                    Download QR Code </a>
            </div>
        </div>
    </div> 

    <script>
        const form = document.getElementById("qrForm");
        const linkInput = document.getElementById("link");
        const message = document.getElementById("message");
        const result = document.getElementById("result");
        const qrImage = document.getElementById("qrImage");
        const download = document.getElementById("download");
        const button = document.getElementById("generateBtn");
        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            message.textContent = "Generating QR code...";
            button.disabled = true;
            result.classList.add("hidden");
            try {
                const response = await fetch("/qr", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        link: linkInput.value.trim()
                    })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || "Something went wrong.");
                }
                qrImage.src = data.imageUrl;
                download.href = data.imageUrl;
                result.classList.remove("hidden");
                message.textContent = "QR code generated successfully!";
            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
